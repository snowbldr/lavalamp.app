<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>lavalamp.app</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="importmap">
    {
      "imports": {
        "@srfnstack/fntags": "https://cdn.jsdelivr.net/npm/@srfnstack/fntags@1.3.0/index.js"
      }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.11.0/dist/NoSleep.min.js"></script>
    <link rel="stylesheet" href="./src/ui/panel.css">
</head>
<body style="font-family: Arial">
<svg id="settings" fill="white" viewBox="0 0 24 24" width="36" height="36">
    <path d="M10.7,2.625a3.481,3.481,0,0,0-6.3,0H0v3H4.395a3.481,3.481,0,0,0,6.3,0H24v-3Z"/>
    <path d="M16.455,8.5a3.492,3.492,0,0,0-3.151,2H0v3H13.3a3.481,3.481,0,0,0,6.3,0H24v-3H19.605A3.492,3.492,0,0,0,16.455,8.5Z"/>
    <path d="M7.545,16.375a3.492,3.492,0,0,0-3.15,2H0v3H4.395a3.481,3.481,0,0,0,6.3,0H24v-3H10.7A3.492,3.492,0,0,0,7.545,16.375Z"/>
</svg>
<script>
  // Which lamp this visit gets. Every version that ever ran here is kept under versions/. A bare
  // visit gets the newest lamp; a link that names a version gets that one; a share link with no
  // version in it is from before versions existed and gets v1, so the links people have keep
  // working (Robert: "the bare url, without settings, should load v2 by default. we should only
  // show v1 if they use a share link without a version"). Someone with v1 settings saved sees a
  // banner in v2 that their settings are kept and where the old lamp is. See src/versions.js.
  (function () {
    var CURRENT = '2'
    var query = new URLSearchParams(window.location.search)
    var v = query.get('v')
    if (!v && query.has('shared')) { try { v = String(JSON.parse(atob(query.get('shared'))).version || '') } catch (e) { v = '' } if (!v) v = '1' }
    if (!v || !/^[0-9.]+$/.test(v)) v = CURRENT
    if (v !== CURRENT) {
      window.lavalampHandoff = v
      window.location.replace('versions/v' + v + '/index.html' + window.location.search + window.location.hash)
    }
  })()
</script>
<script type="module">
  if (!window.lavalampHandoff) import('./src/app.js').then(m => m.start())
</script>
</body>
</html>
