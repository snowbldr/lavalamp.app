<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pinch lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="importmap">

    <link rel="stylesheet" href="../src/ui/panel.css">
    <style>
      body { margin: 0; background: #1c1c1e; color: #ececec; font: 13px system-ui, sans-serif; display: flex; gap: 16px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
      .lab { display: flex; flex-direction: row; align-items: flex-start; gap: 12px; }
      .lamp { background: #e8420a; width: 360px; height: 900px; position: relative; border-radius: 6px; overflow: hidden; }
      .lamp canvas { position: absolute; left: 0; top: 0; }
      .strip { display: flex; gap: 6px; flex-wrap: wrap; max-width: 800px; align-content: flex-start; }
      .strip canvas { background: #e8420a; border-radius: 4px; }
      .panel { position: relative; width: 340px; max-height: none; }
      .panel select { background: #2a2a2d; color: #ececec; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 4px 6px; font: inherit; max-width: 100%; }
      .readout { font-variant-numeric: tabular-nums; color: rgba(236,236,236,0.7); }
    </style>
</head>
